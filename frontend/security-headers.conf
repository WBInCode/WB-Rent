# Security headers shared by every location.
# Kept in a separate file because an `add_header` inside a location block
# discards all headers inherited from the parent - each such block must
# include this file explicitly.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;

# script-src keeps 'unsafe-inline' because the no-FOUC theme bootstrap and the
# JSON-LD blocks (including the ones injected on product pages) are inline.
# style-src needs it for Tailwind/Framer Motion inline styles.
# blob: is required for previewing generated coupon and contract PDFs.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; frame-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
